name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-api:
    name: API tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: geodata_test
          POSTGRES_USER: geouser
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geouser -d geodata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://geouser:testpassword123@localhost:5432/geodata_test
          POSTGRES_PASSWORD: testpassword123
          ENV: local
          DATA_DIR: /tmp/test-data
        run: pytest --tb=short -q

  lint-api:
    name: API lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/

  check-frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type-check
        working-directory: frontend
        # PUBLIC_* env vars are needed so svelte-kit sync generates the
        # $env/static/public types. frontend/.env.development provides these
        # as defaults; the explicit env: block below is a belt-and-suspenders
        # fallback for environments that don't pick up the file.
        env:
          PUBLIC_MARTIN_URL: http://localhost:3000
          PUBLIC_API_URL: http://localhost:8000
          PUBLIC_TITILER_URL: http://localhost:8080
          PUBLIC_R2_URL: ""
        run: npm run check

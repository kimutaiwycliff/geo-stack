# Martin vector tile server configuration — v1.8.0
# Documentation: https://maplibre.org/martin/
#
# Martin auto-discovers all tables with geometry columns in the 'geo' schema.
# Tiles:   https://<host>/{schema}.{table}/{z}/{x}/{y}
# Catalog: https://<host>/catalog
#
# DATABASE_URL MUST point to the Supabase SESSION pooler (port 5432), NOT the
# transaction pooler (port 6543). Martin runs prepared statements during startup
# schema introspection and will hang on the transaction pooler.
#
#   Transaction pooler (broken): ...pooler.supabase.com:6543/postgres
#   Session pooler    (correct): ...pooler.supabase.com:5432/postgres

# listen_addresses is passed via --listen-addresses CLI flag in Dockerfile.render
# so $PORT (injected by Render) expands correctly at runtime.

keep_alive: 75
worker_processes: 1

postgres:
  # search_path is set at the DATABASE level via ALTER DATABASE so it applies
  # to every connection including through Supabase's PgBouncer session pooler.
  # Martin's Rust postgres driver does not support the ?options= URL parameter.
  connection_string: "${DATABASE_URL}"
  pool_size: 5

  # Auto-publish all geometry tables in the 'geo' schema only.
  # from_schemas limits discovery (v1.8 key — replaces the old 'schemas' key).
  # source_id_format must be nested under tables: not at the auto_publish level.
  auto_publish:
    from_schemas:
      - geo
    tables:
      source_id_format: "{schema}.{table}"
    functions: false

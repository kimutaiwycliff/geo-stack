# Martin vector tile server configuration — v1.8.0
# Documentation: https://maplibre.org/martin/
#
# Martin auto-discovers all tables with geometry columns in the 'geo' schema.
# Tiles:   https://<host>/{schema}.{table}/{z}/{x}/{y}
# Catalog: https://<host>/catalog
#
# DATABASE_URL MUST point to the Supabase SESSION pooler (port 5432), NOT the
# transaction pooler (port 6543). Martin runs prepared statements during startup
# schema introspection and will hang on the transaction pooler.
#
#   Transaction pooler (broken): ...pooler.supabase.com:6543/postgres
#   Session pooler    (correct): ...pooler.supabase.com:5432/postgres

# $PORT is injected by Render. Defaults to 3000 for local use.
listen_addresses: "0.0.0.0:${PORT:-3000}"

keep_alive: 75
worker_processes: 1

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 5

  # Auto-publish all geometry tables in the 'geo' schema.
  auto_publish:
    schemas:
      - geo          # Only expose validated production data, not staging or audit
    source_id_format: "{schema}.{table}"
    functions: false # Enable if you add custom MVT-generating SQL functions

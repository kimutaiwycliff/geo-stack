[project]
name = "geo-stack-api"
version = "0.1.0"
description = "Spatial API for geo-stack — FastAPI + DuckDB + PostGIS"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["config", "dependencies", "routers", "spatial"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
